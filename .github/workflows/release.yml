name: Release MoviePoster

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean MoviePoster.spec
          if (-not (Test-Path "dist\MoviePoster\MoviePoster.exe")) { throw "MoviePoster.exe was not produced" }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\MoviePoster\*" -DestinationPath "MoviePoster-windows-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: MoviePoster-windows-x64.zip
